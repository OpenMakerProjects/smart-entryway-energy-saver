<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710"><title>ESP32 energy saver microphone and INA219 switched 5V load</title><rect width="1100" height="710" fill="white"/><g font-family="sans-serif" font-size="18" fill="#123"><text x="25" y="35">ID14 • ESP32 DevKit • GPIO/sensors3.3V • demonstration load5V only</text><rect x="40" y="95" width="350" height="410" fill="#e8f3fa" stroke="#123"/><text x="60" y="135">ESP32</text><text x="60" y="195">GPIO21 SDA; GPIO22 SCL</text><text x="60" y="255">GPIO34 ADC ←mic OUT0–3.3V</text><text x="60" y="315">GPIO25 →relay IN</text><text x="60" y="375">3V3 →INA219/mic VCC</text><text x="60" y="435">GND →common rail</text><text x="60" y="485">USB5V input</text><rect x="650" y="90" width="410" height="125" fill="#eef8ee" stroke="#123"/><text x="670" y="125">INA219 address0x40</text><text x="670" y="160">SDA→21;SCL→22;VCC3V3;GND</text><text x="670" y="195">VIN+ ←fused5V;VIN− →relay COM</text><rect x="650" y="250" width="410" height="90" fill="#eef8ee" stroke="#123"/><text x="670" y="280">Analog microphone</text><text x="670" y="315">VCC3V3;GND;OUT→GPIO34</text><rect x="650" y="375" width="410" height="120" fill="#eef8ee" stroke="#123"/><text x="670" y="410">Active-high 3.3V-compatible relay</text><text x="670" y="445">IN→25;10kΩ IN→GND;VCC5V</text><text x="670" y="480">COM←VIN−;NO→lamp+;NC unused</text><text x="25" y="555">External regulated5V →0.5A fuse →INA219 VIN+ →shunt→VIN− →COM→NO→lamp+</text><text x="25" y="600">Lamp− and external supply− join common GND. Relay coil draws directly from external5V.</text><text x="25" y="645">INA219 measures lamp path only. Demonstration lamp nominal40mA; no mains load.</text><text x="25" y="685">All I2C pullups3.3V. Never connect external5V to controller3V3.</text></g><g stroke="#287396" stroke-width="3" fill="none"><path d="M390 190 H650"/><path d="M390 250 H550 V310 H650"/><path d="M390 310 H580 V440 H650"/><path d="M390 430 H560 V515 H1060"/></g></svg>